[project]
name = "verificador-citacoes"
version = "0.1.0"
description = "Verificador de citações jurídicas — Desafio Jusbrasil x BRACIS 2026"
readme = "README.md"
requires-python = ">=3.12"

# A baseline é determinística e usa só a biblioteca padrão em runtime.
# Nada aqui precisa de rede nem de GPU.
dependencies = []

[project.scripts]
verificador = "verificador.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verificador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
